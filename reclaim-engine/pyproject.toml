[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reclaim-engine"
version = "0.0.1"
description = "RECLAIM — deterministic revenue-integrity engine (foundation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
# The `python -m reclaim` entry shim is a 2-line wrapper around cli.main(),
# which is itself covered 100% by tests/test_cli.py. It is never imported
# during the test run, so exclude it rather than report a false 0%.
omit = ["*/__main__.py"]
